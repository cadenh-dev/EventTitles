name: Release

# Push a tag like v1.1.0 to publish a release:
#   git tag v1.1.0 && git push origin v1.1.0
# The plugin's update checker reads the latest release and verifies the jar against its .sha256 file.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Test and build
        run: ./gradlew test build --no-daemon -PreleaseVersion=${{ steps.version.outputs.version }}

      - name: Checksum
        id: files
        run: |
          JAR="build/libs/EventTitles-${{ steps.version.outputs.version }}.jar"
          test -f "$JAR"
          # Format: "<sha256>  <file name>" (sha256sum style); the plugin reads the first token.
          (cd build/libs && sha256sum "$(basename "$JAR")" > "$(basename "$JAR").sha256")
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.files.outputs.jar }}" \
            "${{ steps.files.outputs.jar }}.sha256" \
            --title "EventTitles ${{ steps.version.outputs.version }}" \
            --generate-notes
