llm:
  enabled: true

  # Which LLM writes contextual titles:
  #   "deepseek" - very cheap, dry sarcastic spectator humour
  #   "grok"     - xAI Grok, spicier terminally-online X/Twitter style roasts ("xai" also accepted)
  provider: "deepseek"

  # Shared defaults; each provider below may override temperature / timeout_seconds.
  # If the LLM does not answer within the timeout, a static title is used instead.
  timeout_seconds: 3
  temperature: 0.7

  providers:
    deepseek:
      endpoint: "https://api.deepseek.com/chat/completions"
      model: "deepseek-chat"
      api_key: "sk-your-deepseek-key-here" # Or set the DEEPSEEK_API_KEY environment variable

    grok:
      endpoint: "https://api.x.ai/v1/chat/completions"
      model: "grok-4.7"
      api_key: "xai-your-grok-key-here" # Or set the XAI_API_KEY environment variable
      temperature: 0.9
      # Grok models can take longer to answer than DeepSeek.
      timeout_seconds: 5

settings:
  # Maximum visible characters for a title (excluding MiniMessage tags).
  # Set to -1 for unlimited length.
  max_title_length: -1

  # Rolling time window (in minutes) for consecutive streak tracking
  streak_window_minutes: 5

display:
  # Height of the title above the top of the player's hitbox, in blocks. The vanilla nametag sits at
  # about +0.5, so 0.8 keeps the title just above it. Tune in-game; /title reload applies it live.
  offset_y: 0.8

  # Whether players can see their own floating title. Vanilla never shows you your own nametag, so the
  # default is false. The server can't tell first- from third-person (F5), so this applies to both.
  show_to_self: false

  # Tell a player in chat when they earn a new title (useful when show_to_self is false).
  announce_to_self: true

  # Client-side smoothing (ticks) for each move as the title follows its player. 3 matches how clients
  # smooth other players' movement, so the title stays in step with the body and nametag. 0 = no
  # smoothing (snappy but jittery); higher = smoother but trails behind.
  interpolation_ticks: 3

tab_list:
  # Show each player's title next to their name in the tab (player list) screen.
  # Note: tab-list plugins like TAB or other nametag plugins may overwrite this name.
  enabled: true

  # MiniMessage format; must contain <player> and <title>.
  format: "<white><player></white> <dark_gray>|</dark_gray> <title>"

  # Visible characters of the title shown in tab (keeps the list narrow). -1 = no limit.
  max_title_length: 24

chat_prefix:
  # Show the sender's title on their own chat messages; hover the title for why they got it.
  enabled: true

  # "replace": the whole line uses the format below, e.g.  Creeper Magnet Caden: hello
  # "prefix":  the format is put in front of the normal line, e.g.  [Creeper Magnet] <Caden> hello
  #            Use prefix if another plugin (EssentialsChat, LuckPerms chat, etc.) formats chat.
  mode: "replace"

  # replace needs <title>, <player> and <message>; prefix needs <title>.
  format: "<title> <white><player></white><dark_gray>:</dark_gray> <message>"
  # format: "<dark_gray>[</dark_gray><title><dark_gray>]</dark_gray> "   # example for prefix mode

  # Visible characters of the title shown in chat. -1 = no limit.
  max_title_length: 24

chat:
  # Let the LLM post a witty one-liner in chat about each event it titles (same API call, no extra cost).
  # Static titles (LLM off, failed, or boss short-circuit) post nothing.
  enabled: true

  # Who sees it: "server" (everyone), "world", "nearby" (within nearby_radius blocks) or "player" (just them).
  audience: "server"
  nearby_radius: 64

  # Minimum seconds between commentary lines about the same player (stops death-spam floods).
  cooldown_seconds: 15

  # MiniMessage format. Must contain <comment>; <player> is also available.
  format: "<dark_gray>[<gold>EventTitles</gold>]</dark_gray> <gray><comment></gray>"

history:
  # Keep a log of every title each player receives; anyone can view it with /title history [player].
  # Stored as plugins/EventTitles/history/<uuid>.json (works for offline players too).
  # Turning this on/off needs a restart; max_entries applies on /title reload.
  enabled: true
  max_entries: 50

showcase:
  # Let players pin up to 5 titles from their /title history above their head with /title show.
  # Chat and the tab list still show only the current title.
  enabled: true
  max_titles: 5   # 1-5

updates:
  # Check GitHub Releases for new EventTitles versions (async; admins are told in chat on join).
  enabled: true
  repository: "cadenh-dev/EventTitles"

  # true = also download the new jar (verified against the release's SHA-256) into plugins/update/;
  # Paper installs it on the next restart. Nothing changes while the server is running.
  auto_download: false

  check_interval_hours: 6

fallbacks:
  default_title: "<gray>Unfortunate Soul</gray>"
